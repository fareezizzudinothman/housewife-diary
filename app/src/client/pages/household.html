<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set up your Housewife Diary household.">
  <title>Household — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Household setup">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Household</p>
            <h1>Household setup</h1>
            <p>Create a household or manage the members of an existing one.</p>
          </div>
          <button type="button" id="logout-button" class="btn btn--ghost">Sign out</button>
        </div>

        <section class="card">
          <div class="card__head">
            <div class="card__head-text">
              <h2>Create a household</h2>
              <p>You will be its owner.</p>
            </div>
          </div>
          <form id="create-household-form" class="form" novalidate>
            <div class="field">
              <label for="household-name">Household name</label>
              <input type="text" id="household-name" name="name" maxlength="80" placeholder="Our home" required>
            </div>
            <button type="submit" class="btn btn--primary">Create household</button>
            <p id="create-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="card">
          <div class="card__head">
            <div class="card__head-text">
              <h2>Your households</h2>
              <p>Switch your active household at any time.</p>
            </div>
          </div>
          <div id="household-list" class="item-list"></div>
        </section>

        <section class="card" id="members-section" hidden>
          <div class="card__head">
            <div class="card__head-text">
              <h2 id="members-heading">Members</h2>
              <p>Roles decide who can manage the household.</p>
            </div>
            <button type="button" id="leave-button" class="btn btn--danger btn--small">Leave household</button>
          </div>
          <div id="members-list" class="item-list"></div>
          <p id="members-status" class="form-status" role="status" aria-live="polite"></p>

          <form id="add-member-form" class="form form--inline" novalidate>
            <div class="field">
              <label for="member-email">Invite by email</label>
              <input type="email" id="member-email" name="email" autocomplete="off" placeholder="member@example.com" required>
            </div>
            <div class="field">
              <label for="member-role">Role</label>
              <select id="member-role" name="role">
                <option value="MEMBER">member</option>
                <option value="VIEWER">viewer</option>
                <option value="ADMIN">admin (owner only)</option>
              </select>
            </div>
            <button type="submit" class="btn btn--primary btn--small">Add member</button>
            <p id="add-member-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/household.js"></script>
</body>
</html>
