<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose a new Housewife Diary password.">
  <title>Reset password — Housewife Diary</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="page page--narrow">
    <header class="app-header">
      <p class="app-brand"><a href="/">Housewife Diary</a></p>
      <h1>Choose a new password</h1>
      <p class="app-tagline">This link is single-use and expires one hour after it was sent.</p>
    </header>

    <section class="card">
      <h2>Reset password</h2>
      <form id="reset-password-form" class="form" novalidate>
        <div class="field">
          <label for="password">New password <span class="field-hint">at least 10 characters</span></label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="10" required>
        </div>
        <button type="submit" class="btn btn--primary">Update password</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="form-links"><a href="/pages/login.html">Back to sign in</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
