<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read a diary entry in Housewife Diary.">
  <title>Entry — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Diary entry">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <a class="back-link" href="/pages/diary.html"><span data-icon="chevron-left" data-icon-size="sm"></span> Back to diary</a>
            <h1 data-entry-title>Loading…</h1>
            <p data-entry-meta></p>
          </div>
          <div class="page-head__actions" data-entry-actions hidden>
            <a class="btn btn--secondary" data-edit-link href="/pages/diary-form.html">Edit</a>
            <button type="button" class="btn btn--danger" data-delete-entry>Delete</button>
          </div>
        </div>

        <div data-entry-notice></div>

        <div data-entry-body aria-live="polite"></div>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/diary-entry.js"></script>
</body>
</html>
