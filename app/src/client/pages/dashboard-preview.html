<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Housewife Diary dashboard preview.">
  <title>Dashboard — Housewife Diary</title>
  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Dashboard">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Preview</p>
            <h1>Dashboard</h1>
            <p>A look at your home at a glance — sample data for now.</p>
          </div>
        </div>

        <section class="stat-grid" data-stats aria-label="Overview"></section>

        <div class="dash-grid">
          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2 data-chart-title>Activity</h2>
                <p>This week</p>
              </div>
            </div>
            <div class="chart" data-chart role="img" aria-label="Weekly activity chart"></div>
            <div class="legend" data-chart-legend></div>
          </section>

          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2>Today’s tasks</h2>
                <p>What needs doing</p>
              </div>
            </div>
            <div class="item-list" data-tasks></div>
          </section>

          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2>Shopping</h2>
                <p data-shopping-label>Weekly list</p>
              </div>
            </div>
            <div class="stack">
              <div class="progress" role="progressbar" data-shopping-progress>
                <div class="progress__fill" data-shopping-fill></div>
              </div>
              <p class="form-status" data-shopping-status></p>
            </div>
          </section>

          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2>Recent diary entries</h2>
                <p>Lately at home</p>
              </div>
            </div>
            <div class="timeline" data-diary></div>
          </section>

          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2 data-suggestions-title>Kitchen inspiration</h2>
                <p>Ideas for you</p>
              </div>
            </div>
            <div data-suggestions></div>
          </section>

          <section class="card">
            <div class="card__head">
              <div class="card__head-text">
                <h2>Household at a glance</h2>
                <p>Quick facts</p>
              </div>
            </div>
            <dl data-facts></dl>
          </section>
        </div>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/dashboard-preview.js"></script>
</body>
</html>
