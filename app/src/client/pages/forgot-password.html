<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your Housewife Diary password.">
  <title>Forgot password — Housewife Diary</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="page page--narrow">
    <header class="app-header">
      <p class="app-brand"><a href="/">Housewife Diary</a></p>
      <h1>Forgot your password?</h1>
      <p class="app-tagline">Enter your email and we'll send you a reset link.</p>
    </header>

    <section class="card">
      <h2>Request a reset link</h2>
      <form id="forgot-password-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn--primary">Send reset link</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="form-links"><a href="/pages/login.html">Back to sign in</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
