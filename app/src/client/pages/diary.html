<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your personal diary in Housewife Diary.">
  <title>Diary — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Diary">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Journal</p>
            <h1>Your diary</h1>
            <p>Private entries only you can read — newest days first.</p>
          </div>
          <a class="btn btn--primary" href="/pages/diary-form.html">New entry</a>
        </div>

        <section class="card card--flat" aria-label="Filters">
          <form id="diary-filters" class="filter-grid" novalidate>
            <div class="field">
              <label for="filter-search">Search</label>
              <input type="search" id="filter-search" name="search" maxlength="100" placeholder="Title or text…">
            </div>
            <div class="field">
              <label for="filter-from">From</label>
              <input type="date" id="filter-from" name="from" min="1900-01-01" max="2100-12-31">
            </div>
            <div class="field">
              <label for="filter-to">To</label>
              <input type="date" id="filter-to" name="to" min="1900-01-01" max="2100-12-31">
            </div>
            <div class="field">
              <label for="filter-mood">Mood</label>
              <select id="filter-mood" name="mood">
                <option value="">Any mood</option>
              </select>
            </div>
            <div class="field">
              <label for="filter-tag">Tag</label>
              <select id="filter-tag" name="tag">
                <option value="">Any tag</option>
              </select>
            </div>
            <div class="filter-grid__actions">
              <button type="submit" class="btn btn--secondary btn--small">Apply</button>
              <button type="button" class="btn btn--ghost btn--small" data-reset>Reset</button>
            </div>
          </form>
        </section>

        <p id="diary-filter-status" class="form-status" role="status" aria-live="polite"></p>

        <div data-diary-list aria-live="polite"></div>

        <nav class="pager" data-pager hidden aria-label="Diary pages">
          <button type="button" class="btn btn--secondary btn--small" data-page-prev>Previous</button>
          <span class="pager__label" data-page-label></span>
          <button type="button" class="btn btn--secondary btn--small" data-page-next>Next</button>
        </nav>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/diary.js"></script>
</body>
</html>
