<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Household finance accounts in Housewife Diary.">
  <title>Accounts — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Accounts">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner main-inner--narrow">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Money</p>
            <h1>Accounts</h1>
            <p>Cash, bank, cards and wallets — balances are derived from your ledger.</p>
          </div>
          <div class="page-head__actions">
            <button type="button" class="btn btn--primary" data-new-account disabled>New account</button>
          </div>
        </div>

        <p id="accounts-status" class="form-status" role="status" aria-live="polite"></p>

        <div class="toolbar">
          <label class="field--check">
            <input type="checkbox" data-include-archived>
            Show archived
          </label>
        </div>

        <div data-accounts aria-live="polite"></div>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/accounts.js"></script>
</body>
</html>
