<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documents in Housewife Diary.">
  <title>Documents — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Documents">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <a class="back-link" href="/pages/home.html">
              <span data-icon="chevron-left" data-icon-size="sm"></span>
              Back to Home
            </a>
            <p class="eyebrow">Home</p>
            <h1>Documents</h1>
            <p>Secure storage for warranties, contracts, and important papers.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--primary" href="/pages/document-form.html">Upload document</a>
          </div>
        </div>

        <section class="card card--flat" aria-label="Filters">
          <form id="document-filters" class="filter-grid" novalidate>
            <div class="field">
              <label for="filter-search">Search</label>
              <input type="search" id="filter-search" name="search" maxlength="120" placeholder="Title or description…">
            </div>
            <div class="field">
              <label for="filter-category">Category</label>
              <select id="filter-category" name="category">
                <option value="">All categories</option>
                <option value="INSURANCE">Insurance</option>
                <option value="WARRANTY">Warranty</option>
                <option value="RECEIPT">Receipt</option>
                <option value="CONTRACT">Contract</option>
                <option value="PROPERTY">Property</option>
                <option value="SCHOOL">School</option>
                <option value="MEDICAL">Medical</option>
                <option value="FINANCIAL">Financial</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="filter-status">Status</label>
              <select id="filter-status" name="status">
                <option value="ACTIVE">Active</option>
                <option value="EXPIRING_SOON">Expiring soon</option>
                <option value="EXPIRED">Expired</option>
                <option value="">All</option>
              </select>
            </div>
            <div class="filter-grid__actions">
              <button type="submit" class="btn btn--secondary btn--small">Apply</button>
              <button type="button" class="btn btn--ghost btn--small" data-reset>Reset</button>
            </div>
          </form>
        </section>

        <p id="document-status" class="form-status" role="status" aria-live="polite"></p>

        <div data-document-list aria-live="polite"></div>

        <nav class="pager" data-pager hidden aria-label="Document pages">
          <button type="button" class="btn btn--secondary btn--small" data-page-prev>Previous</button>
          <span class="pager__label" data-page-label></span>
          <button type="button" class="btn btn--secondary btn--small" data-page-next>Next</button>
        </nav>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/documents.js"></script>
</body>
</html>
