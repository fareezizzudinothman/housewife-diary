<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Housewife Diary.">
  <title>Sign in — Housewife Diary</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="page page--narrow">
    <header class="app-header">
      <p class="app-brand"><a href="/">Housewife Diary</a></p>
      <h1>Sign in</h1>
      <p class="app-tagline">Welcome back — your household is waiting.</p>
    </header>

    <section class="card">
      <h2>Account sign in</h2>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="field field--inline">
          <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
          <label for="rememberMe">Remember me for 30 days</label>
        </div>
        <button type="submit" class="btn btn--primary">Sign in</button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="form-links">
        No account yet? <a href="/pages/register.html">Create one</a>
        · <a href="/pages/forgot-password.html">Forgot password?</a>
      </p>
    </section>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
