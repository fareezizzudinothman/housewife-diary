<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan a meal in Housewife Diary.">
  <title>Meal — Housewife Diary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c96e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Housewife Diary">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Plan a meal">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner main-inner--narrow">
        <a class="back-link" href="/pages/meals.html">← Meal plan</a>

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Kitchen</p>
            <h1 data-form-title>Plan a meal</h1>
            <p data-form-subtitle>Pick a recipe, or name the meal yourself.</p>
          </div>
        </div>

        <div data-form-notice></div>

        <form id="meal-form" class="card form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="meal-date">Date</label>
              <input type="date" id="meal-date" name="date" min="1900-01-01" max="2100-12-31" required>
            </div>
            <div class="field">
              <label for="meal-type">Meal</label>
              <select id="meal-type" name="mealType">
                <option value="BREAKFAST">Breakfast</option>
                <option value="LUNCH">Lunch</option>
                <option value="DINNER" selected>Dinner</option>
                <option value="SNACK">Snack</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="meal-recipe">Recipe</label>
            <select id="meal-recipe" name="recipeId">
              <option value="">No recipe</option>
            </select>
            <p class="field-hint">Recipes can be added to a shopping list from the meal plan.</p>
          </div>

          <div class="field">
            <label for="meal-title">Name</label>
            <input type="text" id="meal-title" name="title" maxlength="160" placeholder="e.g. Leftovers, Takeaway">
            <p class="field-hint">Only needed when no recipe is chosen.</p>
          </div>

          <div class="field">
            <label for="meal-notes">Notes</label>
            <textarea id="meal-notes" name="notes" rows="2" maxlength="1000" placeholder="Optional"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Save meal</button>
            <a class="btn btn--ghost" href="/pages/meals.html">Cancel</a>
            <button type="button" class="btn btn--danger" data-delete hidden>Remove</button>
          </div>
          <p id="meal-form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/meal-form.js"></script>
</body>
</html>
