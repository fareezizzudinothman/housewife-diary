<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notes in Housewife Diary.">
  <title>Notes — Housewife Diary</title>
  <script src="/js/theme/boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page-title="Notes">
  <div class="app-shell">
    <header class="app-topbar" data-shell="topbar"></header>
    <nav class="app-sidebar" data-shell="sidebar" aria-label="Main"></nav>

    <main class="app-main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow">Personal</p>
            <h1>Notes</h1>
            <p>Quick thoughts, lists, and reference material.</p>
          </div>
          <div class="page-head__actions">
            <a class="btn btn--primary" href="/pages/note-form.html">New note</a>
          </div>
        </div>

        <section class="card card--flat" aria-label="Filters">
          <form id="note-filters" class="filter-grid" novalidate>
            <div class="field">
              <label for="filter-search">Search</label>
              <input type="search" id="filter-search" name="search" maxlength="100" placeholder="Title or content…">
            </div>
            <div class="field">
              <label for="filter-category">Category</label>
              <input type="text" id="filter-category" name="category" maxlength="100" placeholder="Category…">
            </div>
            <div class="field">
              <label for="filter-tag">Tag</label>
              <input type="text" id="filter-tag" name="tag" maxlength="40" placeholder="Tag…">
            </div>
            <div class="field">
              <label for="filter-pinned">Pinned</label>
              <select id="filter-pinned" name="pinned">
                <option value="">All</option>
                <option value="true">Pinned only</option>
                <option value="false">Unpinned only</option>
              </select>
            </div>
            <div class="field">
              <label for="filter-archived">Archived</label>
              <select id="filter-archived" name="archived">
                <option value="false">Active only</option>
                <option value="true">Archived only</option>
                <option value="">All</option>
              </select>
            </div>
            <div class="filter-grid__actions">
              <button type="submit" class="btn btn--secondary btn--small">Apply</button>
              <button type="button" class="btn btn--ghost btn--small" data-reset>Reset</button>
            </div>
          </form>
        </section>

        <p id="note-status" class="form-status" role="status" aria-live="polite"></p>

        <div data-note-list aria-live="polite"></div>

        <nav class="pager" data-pager hidden aria-label="Note pages">
          <button type="button" class="btn btn--secondary btn--small" data-page-prev>Previous</button>
          <span class="pager__label" data-page-label></span>
          <button type="button" class="btn btn--secondary btn--small" data-page-next>Next</button>
        </nav>
      </div>
    </main>

    <nav class="app-bottomnav" data-shell="bottomnav" aria-label="Main"></nav>
  </div>
  <script type="module" src="/js/pages/notes.js"></script>
</body>
</html>
